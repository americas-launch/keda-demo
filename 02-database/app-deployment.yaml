apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-app-sa
  namespace: keda-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-app-role
  namespace: keda-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-app-binding
  namespace: keda-demo
subjects:
  - kind: ServiceAccount
    name: db-app-sa
    namespace: keda-demo
roleRef:
  kind: Role
  name: db-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-app
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-app
  template:
    metadata:
      labels:
        app: db-app
    spec:
      serviceAccountName: db-app-sa
      containers:
        - name: app
          image: python:3.11-slim
          command:
            - bash
            - -c
            - |
              pip install --quiet --user psycopg2-binary && python3 -u /app/server.py
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: logo
              mountPath: /logo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: app-code
          configMap:
            name: db-app-code
        - name: logo
          configMap:
            name: http-app-logo
