apiVersion: v1
kind: Service
metadata:
  name: db-app
  namespace: keda-demo
  labels:
    app: db-app
spec:
  selector:
    app: db-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: db-app
  namespace: keda-demo
spec:
  to:
    kind: Service
    name: db-app
  port:
    targetPort: http
