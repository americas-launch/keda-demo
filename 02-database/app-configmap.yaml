    .pods-sidebar::-webkit-scrollbar { width: 4px; }
    .pods-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
    .pods-sidebar .section-title { font-size: .8rem; }

    header { text-align: center; margin-bottom: 2.5rem; }
    header img { height: 44px; margin-bottom: 1rem; filter: drop-shadow(0 0 20px rgba(255,255,255,.08)); }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: .35rem; }
    header h1 em { font-style: normal; background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { color: var(--text-dim); font-size: .9rem; font-weight: 400; }

    .glass {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: border-color .2s;
    }
    .glass:hover { border-color: var(--border-hover); }

    .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
    .stat-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .75rem; }

    .gauge-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; }
    .gauge {
      position: relative; width: 150px; height: 150px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background .6s ease;
    }
    .gauge-inner {
      width: 120px; height: 120px; border-radius: 50%;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; z-index: 1;
    }
    .gauge-pct {
      font-family: 'Red Hat Mono', monospace; font-size: 2rem; font-weight: 700;
      line-height: 1;
    }
    .gauge-pct-label { font-size: .55rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin-top: .2rem; }
    .gauge-legend {
      display: flex; gap: 1.25rem; font-size: .85rem; color: var(--text-dim); font-weight: 500;
    }
    .gauge-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: .3rem; vertical-align: middle; }

    .eta-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: .2rem;
    }
    .eta-value {
      font-family: 'Red Hat Mono', monospace; font-size: 2.2rem; font-weight: 700;
      line-height: 1; margin: .4rem 0;
    }
    .eta-sub { font-size: .7rem; color: var(--text-dim); }

    .card-label {
      font-size: .6rem; text-transform: uppercase; letter-spacing: .1em;
      color: var(--text-dim); margin-bottom: .5rem; font-weight: 600;
    }
    .card-value {
      font-family: 'Red Hat Mono', monospace; font-size: 1.8rem; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .card-sub { font-size: .7rem; color: var(--text-dim); margin-top: .3rem; }
    .ticker-card { overflow: hidden; }
    .ticker {
      display: flex; justify-content: center; gap: 0;
      font-family: 'Red Hat Mono', monospace; font-size: 1.8rem; font-weight: 700;
      line-height: 1; font-variant-numeric: tabular-nums;
    }
    .ticker-slot {
      position: relative; overflow: hidden;
      width: 1.15em; height: 1.3em;
      display: flex; align-items: center; justify-content: center;
    }
    .ticker-slot.digit {
      background: rgba(255,255,255,.04); border-radius: 4px;
      margin: 0 1px; border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.3);
    }
    .ticker-ch { display: block; }
    .roll-enter-active, .roll-leave-active { transition: all .3s ease; }
    .roll-enter-from { transform: translateY(100%); opacity: 0; }
    .roll-leave-to { transform: translateY(-100%); opacity: 0; }
    .v-green { color: var(--green); }
    .v-red { color: var(--red); }
    .v-amber { color: var(--amber); }
    .v-accent { color: var(--accent); }
    .v-cyan { color: var(--cyan); }

    .keda-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; text-align: center; }
    .keda-label { font-size: .55rem; text-transform: uppercase; letter-spacing: .12em; color: var(--text-dim); font-weight: 600; }
    .keda-badge {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .8rem; font-weight: 600;
      padding: .35rem .9rem; border-radius: 20px;
    }
    .keda-badge.off { background: var(--red-soft); color: var(--red); }
    .keda-badge.on { background: var(--green-soft); color: var(--green); }
    .keda-dot { width: 8px; height: 8px; border-radius: 50%; }
    .keda-badge.off .keda-dot { background: var(--red); }
    .keda-badge.on .keda-dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse-glow 2s infinite; }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 4px var(--green); }
      50% { box-shadow: 0 0 14px var(--green); }
    }
    .keda-desc { font-size: .72rem; color: var(--text-dim); line-height: 1.6; max-width: 300px; }
    .keda-desc code {
      font-family: 'Red Hat Mono', monospace; font-size: .62rem;
      background: var(--surface-2); padding: .1rem .35rem; border-radius: 4px;
      border: 1px solid var(--border);
    }

    .toggle-wrap { display: flex; align-items: center; gap: .75rem; cursor: pointer; }
    .toggle-label {
      font-family: 'Red Hat Display', sans-serif; font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim);
      transition: color .3s;
