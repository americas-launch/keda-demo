    .progress-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--green), #6ee7b7);
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    .chart-wrap { margin-top: 1rem; }
    .chart-wrap canvas { width: 100% !important; height: 140px !important; }

    .timeline-box {
      max-height: 140px; overflow-y: auto;
      font-family: 'Red Hat Mono', monospace; font-size: .68rem;
      line-height: 1.7; padding: .7rem; background: var(--surface-2); border-radius: var(--radius-sm);
    }
    .ev { display: flex; gap: .5rem; }
    .ev .t { color: var(--text-dim); opacity: .4; white-space: nowrap; }
    .ev.added .m { color: var(--green); }
    .ev.removed .m { color: var(--red); }
    .ev.info .m { color: var(--cyan); }
    .ev.warn .m { color: var(--amber); }

    .pods-list { display: flex; flex-direction: column; gap: .5rem; }
    .pod-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .85rem;
      transition: all .3s cubic-bezier(.4,0,.2,1);
    }
    .pod-enter { animation: pod-in .4s cubic-bezier(.4,0,.2,1); }
    @keyframes pod-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
    .pod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
    .pod-name {
      font-family: 'Red Hat Mono', monospace; font-size: .65rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;
    }
    .pod-phase {
      font-size: .55rem; text-transform: uppercase; letter-spacing: .06em;
      padding: .15rem .45rem; border-radius: 4px; font-weight: 700;
    }
    .pod-phase.running { background: var(--green-soft); color: var(--green); }
    .pod-phase.pending { background: var(--amber-soft); color: var(--amber); }
    .pod-phase.containercreating { background: var(--cyan-soft); color: var(--cyan); }
    .pod-phase.terminating { background: var(--red-soft); color: var(--red); }
    .pod-info { font-size: .65rem; color: var(--text-dim); display: flex; gap: .75rem; align-items: center; }
    .pod-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: .2rem; }
    .pod-dot.up { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .pod-dot.down { background: var(--amber); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .pods-empty {
      font-size: .72rem; color: var(--text-dim); text-align: center;
      padding: 1.25rem .5rem; line-height: 1.7;
    }
    .pods-empty-icon { font-size: 1.5rem; margin-bottom: .3rem; opacity: .3; }

    .fade-enter-active { transition: all .3s ease; }
    .fade-enter-from { opacity: 0; transform: translateY(4px); }

    @media (max-width: 900px) {
      .app { padding: 1.25rem; max-width: 100%; }
      .main-layout { grid-template-columns: 1fr; }
      .pods-sidebar { position: static; max-height: none; }
      .grid-top { grid-template-columns: 1fr; }
      .live-stats { grid-template-columns: repeat(2, 1fr); }
    }
    </style>
    </head>
    <body>
    <div id="app">
      <div class="app">
        <header>
          <img src="/logo.png" alt="Red Hat">
          <h1><em>KEDA</em> Database Scaling Demo</h1>
          <p>Workers auto-scale from zero based on pending rows in PostgreSQL</p>
        </header>

        <div class="main-layout">
          <div class="main-content">
            <div class="grid-top">
              <div class="stat-cards">
                <div class="glass">
                  <div class="card-label">Workers</div>
                  <div class="card-value v-accent">{{ deployment.ready }}</div>
                  <div class="card-sub">desired: {{ deployment.desired }}</div>
                </div>
                <div class="glass ticker-card">
                  <div class="card-label">Total Jobs</div>
                  <div class="ticker">
                    <div v-for="(d, i) in tickerDigits" :key="d.key"
                         class="ticker-slot digit">
                      <transition name="roll" mode="out-in">
                        <span :key="d.ch" class="ticker-ch">{{ d.ch }}</span>
                      </transition>
                    </div>
                  </div>
                  <div class="card-sub">uptime: {{ uptimeStr }}</div>
                </div>
                <div class="glass eta-wrap">
                  <div class="card-label">Time to Complete</div>
                  <div class="eta-value" :class="etaColor">{{ eta.text }}</div>
                  <div class="eta-sub" v-if="eta.remaining > 0">{{ eta.remaining }} jobs remaining</div>
                  <div class="eta-sub" v-else>Queue empty</div>
                </div>
              </div>

              <div class="glass keda-panel">
                <div class="keda-label">KEDA Autoscaler</div>
                <div :class="['keda-badge', kedaPaused ? 'off' : 'on']">
                  <span class="keda-dot"></span>
                  {{ kedaPaused ? 'Disabled' : 'Active' }}
                </div>
                <div class="keda-desc">
                  <template v-if="kedaPaused">
                    1 baseline worker is processing the queue.<br>
                    Seed jobs to watch it struggle, then enable KEDA to scale up.
                  </template>
                  <template v-else>
                    KEDA is scaling workers based on pending row count.<br>
                    Watch the processing rate jump as more workers come online.
                  </template>
                </div>
                <div class="controls-row">
                  <div class="control-group">
                    <div class="control-group-label">KEDA</div>
                    <div :class="['toggle-wrap', kedaPaused ? 'off' : 'on']" @click="toggleKeda">
                      <div class="toggle-track"><div class="toggle-thumb"></div></div>
                      <span class="toggle-label">{{ kedaPaused ? 'Off' : 'On' }}</span>
                    </div>
                  </div>
                </div>
                <div class="seed-controls">
                  <div class="control-group-label">Seed Jobs</div>
                  <div class="seed-buttons">
                    <button class="btn-seed" @click="seedJobs(10)">+10</button>
                    <button class="btn-seed" @click="seedJobs(50)">+50</button>
                    <button class="btn-seed" @click="seedJobs(100)">+100</button>
                  </div>
                  <button class="btn-clear" @click="clearJobs">Clear All Jobs</button>
                </div>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">Job Queue</div>
              <div class="live-stats">
                <div :class="['live-stat', {'pending-alert': jobStats.pending > 0 && deployment.ready === 0}]">
                  <div class="live-stat-value v-amber">{{ jobStats.pending }}</div>
                  <div class="live-stat-label">Pending</div>
                  <div class="threshold-label">threshold: <span>{{ THRESHOLD }}</span></div>
                </div>
                <div class="live-stat">
                  <div class="live-stat-value v-cyan">{{ jobStats.processing }}</div>
                  <div class="live-stat-label">Processing</div>
                </div>
                <div class="live-stat">
                  <div class="live-stat-value v-green">{{ jobStats.done }}</div>
                  <div class="live-stat-label">Done</div>
                </div>
                <div :class="['live-stat', {'rate-high': parseFloat(rate) > 0.5}]">
                  <div class="live-stat-value" :class="parseFloat(rate) > 0.5 ? 'v-green' : 'v-accent'">{{ rate }}</div>
                  <div class="live-stat-label">Jobs / sec</div>
                </div>
              </div>
              <div class="progress-wrap">
                <div class="progress-label">
                  <span>Completed</span>
                  <span>{{ jobStats.done }} / {{ jobStats.total }}</span>
                </div>
                <div class="progress-bg">
                  <div class="progress-fill" :style="{width: progressPct + '%'}"></div>
                </div>
              </div>
              <div class="chart-wrap">
                <canvas ref="chartCanvas"></canvas>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">Timeline</div>
              <div class="timeline-box" ref="timeline">
                <div v-for="(ev, i) in events" :key="i" :class="['ev', ev.cls]">
                  <span class="t">{{ ev.time }}</span>
                  <span class="m">{{ ev.msg }}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="glass pods-sidebar">
            <div class="section-title">
              Workers <span class="badge">{{ pods.length }}</span>
            </div>
            <div class="pods-list">
              <div v-for="p in pods" :key="p.name" class="pod-card pod-enter">
                <div class="pod-header">
                  <span class="pod-name">{{ p.name }}</span>
                  <span :class="['pod-phase', p.phase.toLowerCase().replace(/\s/g,'')]">
                    {{ p.phase }}
                  </span>
                </div>
                <div class="pod-info">
                  <span>
                    <span :class="['pod-dot', p.ready ? 'up' : 'down']"></span>
                    {{ p.ready ? 'Ready' : 'Not Ready' }}
                  </span>
                  <span>Age: {{ timeSince(p.created) }}</span>
                </div>
              </div>
              <div v-if="pods.length === 0" class="pods-empty">
                <div class="pods-empty-icon">0</div>
                No workers running.<br>
                KEDA will scale from zero<br>when pending jobs appear.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;

    createApp({
      setup() {
        const THRESHOLD = 5;
        const jobStats = reactive({ pending: 0, processing: 0, done: 0, total: 0, uptime_seconds: 0 });
        const deployment = reactive({ ready: 0, desired: 0 });
        const pods = ref([]);
        const kedaPaused = ref(true);
        const events = reactive([]);
        const knownPods = new Set();
        const chartCanvas = ref(null);
        const timeline = ref(null);
        const rate = ref('0.0');
        let chart = null;
        let intervals = [];
        let doneHistory = [];

        const uptimeStr = computed(() => {
          const m = Math.floor(jobStats.uptime_seconds / 60);
          const s = Math.floor(jobStats.uptime_seconds % 60);
          return m + 'm ' + s + 's';
        });

        function formatTime(s) {
          if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
          if (s >= 60) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
          return s + 's';
        }

        const eta = computed(() => {
          const remaining = jobStats.pending + jobStats.processing;
          if (remaining === 0) return { text: '--', remaining: 0, seconds: 0 };
          const measuredRate = parseFloat(rate.value) || 0;
          const workers = Math.max(deployment.ready, 0);
          const estimatedRate = workers / 3;
          const r = measuredRate > 0 ? measuredRate : estimatedRate;
          if (r <= 0) return { text: '...', remaining: remaining, seconds: 9999 };
          const secs = Math.round(remaining / r);
          return { text: formatTime(secs), remaining: remaining, seconds: secs };
        });

        const etaColor = computed(() => {
          const s = eta.value.seconds;
          if (s === 0) return 'v-accent';
          if (s > 120) return 'v-red';
          if (s > 30) return 'v-amber';
          return 'v-green';
        });

        const progressPct = computed(() => {
          if (jobStats.total === 0) return 0;
          return Math.round(jobStats.done / jobStats.total * 100);
        });

        const tickerDigits = computed(() => {
          const s = String(jobStats.total);
          const padded = s.padStart(4, '0');
          return padded.split('').map((ch, i) => ({ ch, key: i }));
        });

        function timeSince(iso) {
          const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
          if (s < 60) return s + 's';
          if (s < 3600) return Math.floor(s / 60) + 'm';
          return Math.floor(s / 3600) + 'h';
        }

        function tlog(msg, cls) {
          events.push({ time: new Date().toLocaleTimeString(), msg, cls: cls || '' });
          if (events.length > 100) events.splice(0, events.length - 80);
          nextTick(() => { if (timeline.value) timeline.value.scrollTop = timeline.value.scrollHeight; });
        }

        async function fetchStats() {
          try {
            const d = await (await fetch('/stats')).json();
            const now = Date.now();
            doneHistory.push({ done: d.done, time: now });
            if (doneHistory.length > 6) doneHistory.shift();
            if (doneHistory.length >= 2) {
              const oldest = doneHistory[0];
              const elapsed = (now - oldest.time) / 1000;
              if (elapsed > 0) {
                rate.value = ((d.done - oldest.done) / elapsed).toFixed(1);
              }
            }
            Object.assign(jobStats, d);
          } catch(e) {}
        }

        async function fetchPods() {
          try {
            const d = await (await fetch('/pods')).json();
            deployment.ready = d.deployment.ready || 0;
            deployment.desired = d.deployment.desired;
            const current = new Set(d.pods.map(p => p.name));
            for (const name of knownPods) {
              if (!current.has(name)) {
                knownPods.delete(name);
                tlog('Worker removed: ' + name.split('-').pop(), 'removed');
              }
            }
            d.pods.forEach(p => {
              if (!knownPods.has(p.name)) {
                tlog('Worker added: ' + p.name.split('-').pop() + ' (' + p.phase + ')', 'added');
                knownPods.add(p.name);
              }
            });
            pods.value = d.pods;
          } catch(e) {}
        }

        async function fetchKeda() {
          try {
            const d = await (await fetch('/keda-status')).json();
            kedaPaused.value = d.paused;
          } catch(e) {}
        }

        async function toggleKeda() {
          const action = kedaPaused.value ? 'enable' : 'disable';
          kedaPaused.value = !kedaPaused.value;
          if (action === 'enable') {
            tlog('KEDA ENABLED — autoscaling workers based on queue depth', 'info');
          } else {
            tlog('KEDA DISABLED — falling back to 1 baseline worker', 'warn');
          }
          try {
            await fetch('/keda-toggle?action=' + action, {method: 'POST'});
          } catch(e) {
            kedaPaused.value = !kedaPaused.value;
            tlog('Failed to toggle KEDA', 'warn');
          }
          fetchKeda();
          fetchPods();
        }

        async function seedJobs(count) {
          tlog('Seeding ' + count + ' jobs...', 'info');
          try {
            await fetch('/seed?count=' + count, {method: 'POST'});
            tlog(count + ' pending jobs inserted', 'added');
            doneHistory = [];
            fetchStats();
          } catch(e) {
            tlog('Failed to seed jobs', 'warn');
          }
        }

        async function clearJobs() {
          tlog('Clearing all jobs...', 'info');
          try {
            await fetch('/clear', {method: 'POST'});
            tlog('All jobs cleared', 'removed');
            doneHistory = [];
            rate.value = '0.0';
            fetchStats();
          } catch(e) {
            tlog('Failed to clear jobs', 'warn');
          }
        }

        function initChart() {
          if (!chartCanvas.value) return;
          const ctx = chartCanvas.value.getContext('2d');
          chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: [],
              datasets: [
                {
                  label: 'Pending', data: [], borderColor: '#fbbf24',
                  backgroundColor: 'rgba(251,191,36,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2,
                },
                {
                  label: 'Threshold', data: [], borderColor: 'rgba(251,191,36,.5)',
                  backgroundColor: 'transparent', fill: false,
                  borderDash: [6, 4], tension: 0, pointRadius: 0, borderWidth: 1.5,
                },
                {
                  label: 'Jobs/sec', data: [], borderColor: '#34d399',
                  backgroundColor: 'rgba(52,211,153,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2,
                },
                {
                  label: 'Workers', data: [], borderColor: '#818cf8',
                  backgroundColor: 'rgba(129,140,248,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2, yAxisID: 'y1',
                },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              animation: { duration: 300 },
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: {
                  labels: { color: 'rgba(255,255,255,.45)', font: { family: 'Red Hat Display', size: 10 }, boxWidth: 12, padding: 12 },
                },
              },
              scales: {
                x: { display: false },
                y: {
                  position: 'left', beginAtZero: true,
                  grid: { color: 'rgba(255,255,255,.04)' },
                  ticks: { color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                  title: { display: true, text: 'pending / rate', color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                },
                y1: {
                  position: 'right', beginAtZero: true,
                  grid: { drawOnChartArea: false },
                  ticks: { color: 'rgba(129,140,248,.5)', font: { size: 10 }, stepSize: 1 },
                  title: { display: true, text: 'workers', color: 'rgba(129,140,248,.5)', font: { size: 10 } },
                },
              },
            },
          });
        }

        function updateChart() {
          if (!chart) return;
          const now = new Date().toLocaleTimeString();
          chart.data.labels.push(now);
          chart.data.datasets[0].data.push(jobStats.pending);
          chart.data.datasets[1].data.push(THRESHOLD);
          chart.data.datasets[2].data.push(parseFloat(rate.value));
          chart.data.datasets[3].data.push(deployment.ready);

          const maxPts = 60;
          if (chart.data.labels.length > maxPts) {
            chart.data.labels.splice(0, chart.data.labels.length - maxPts);
            chart.data.datasets.forEach(ds => ds.data.splice(0, ds.data.length - maxPts));
          }
          chart.update('none');
        }

        onMounted(() => {
          fetchStats(); fetchPods(); fetchKeda();
          initChart();
          intervals.push(setInterval(() => { fetchStats().then(updateChart); }, 2000));
          intervals.push(setInterval(fetchPods, 2000));
          intervals.push(setInterval(fetchKeda, 3000));
        });

        onUnmounted(() => intervals.forEach(clearInterval));

        return {
          THRESHOLD, jobStats, deployment, pods, kedaPaused, rate,
          events, uptimeStr, eta, etaColor,
          progressPct, tickerDigits, chartCanvas, timeline,
          timeSince, toggleKeda, seedJobs, clearJobs,
        };
      },
    }).mount('#app');
    </script>
    </body>
    </html>'''

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/healthz':
                self._ok(b'ok')
                return

            if self.path == '/logo.png':
                try:
                    with open('/logo/rhlogo.png', 'rb') as f:
                        data = f.read()
                    self.send_response(200)
                    self.send_header('Content-Type', 'image/png')
                    self.send_header('Cache-Control', 'public, max-age=86400')
                    self.end_headers()
                    self.wfile.write(data)
                except FileNotFoundError:
                    self.send_response(404)
                    self.end_headers()
                return

            if self.path == '/stats':
                try:
                    s = get_job_stats()
                    s['uptime_seconds'] = round(time.time() - start_time, 1)
                    self._json(s)
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/pods':
                try:
                    self._json({'pods': get_pods(), 'deployment': get_deployment()})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/keda-status':
                try:
                    self._json(get_keda_status())
                except Exception as e:
                    self._json({'paused': True, 'error': str(e)})
                return

            self.send_response(200)
            self.send_header('Content-Type', 'text/html')
            self.end_headers()
            self.wfile.write(HTML.encode())

        def do_POST(self):
            if self.path.startswith('/seed'):
                count = 50
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    count = min(int(params.get('count', 50)), 500)
                try:
                    seed_jobs(count)
                    self._json({'ok': True, 'seeded': count})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/clear':
                try:
                    clear_jobs()
                    self._json({'ok': True})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path.startswith('/keda-toggle'):
                action = 'enable'
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    action = params.get('action', 'enable')
                try:
                    if action == 'disable':
                        set_keda_paused(True)
                        scale_deployment(1)
                    else:
                        set_keda_paused(False)
                    self._json({'ok': True, 'action': action})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

        def _ok(self, body):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)

        def _json(self, data, code=200):
            self.send_response(code)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode())

        def log_message(self, format, *args):
            pass

    server = ThreadedHTTPServer(('', 8080), Handler)
    print(f"DB dashboard on :8080 (pod: {hostname})")
    server.serve_forever()
