      font-size: .85rem; font-weight: 700; margin-bottom: .75rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .badge {
      font-family: 'Red Hat Mono', monospace; background: var(--surface-2);
      border: 1px solid var(--border); padding: .15rem .5rem; border-radius: 8px;
      font-size: .65rem; color: var(--text-dim); font-weight: 500;
