    .toggle-wrap.on .toggle-label { color: var(--green); }
    .toggle-wrap.off .toggle-label { color: var(--red); }
    .toggle-track {
      width: 56px; height: 30px; border-radius: 15px;
      position: relative; transition: background .3s, box-shadow .3s;
