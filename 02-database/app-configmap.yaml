apiVersion: v1
kind: ConfigMap
metadata:
  name: db-app-code
  namespace: keda-demo
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from socketserver import ThreadingMixIn
    import json, os, ssl, time, urllib.request

    class ThreadedHTTPServer(ThreadingMixIn, HTTPServer):
        daemon_threads = True

    hostname = os.environ.get('HOSTNAME', 'unknown')
    namespace = 'keda-demo'
    start_time = time.time()

    import psycopg2

    def get_job_stats():
        conn = psycopg2.connect(os.environ['CONNECTION_STRING'])
        conn.autocommit = True
        cur = conn.cursor()
        cur.execute("SELECT status, COUNT(*) FROM jobs GROUP BY status")
        rows = cur.fetchall()
        result = {'pending': 0, 'processing': 0, 'done': 0, 'total': 0}
        for status, count in (rows or []):
            if status in result:
                result[status] = count
            result['total'] += count
        cur.close()
        conn.close()
        return result

    def seed_jobs(count):
        conn = psycopg2.connect(os.environ['CONNECTION_STRING'])
        conn.autocommit = True
        cur = conn.cursor()
        for i in range(count):
            cur.execute(
                "INSERT INTO jobs (payload, status) VALUES (%s, 'pending')",
                (f'task: process data batch {i}',)
            )
        cur.close()
        conn.close()

    def clear_jobs():
        conn = psycopg2.connect(os.environ['CONNECTION_STRING'])
        conn.autocommit = True
        cur = conn.cursor()
        cur.execute("DELETE FROM jobs")
        cur.close()
        conn.close()

    K8S_HOST = 'https://kubernetes.default.svc'
    TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    CA_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'

    def k8s_get(path):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            headers={'Authorization': f'Bearer {token}'},
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def k8s_request(method, path, body=None):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        data = json.dumps(body).encode() if body else None
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            data=data,
            headers={
                'Authorization': f'Bearer {token}',
                'Content-Type': 'application/merge-patch+json',
            },
            method=method,
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def get_pods():
        data = k8s_get(f'/api/v1/namespaces/{namespace}/pods?labelSelector=app%3Ddb-worker')
        pods = []
        for item in data.get('items', []):
            meta = item['metadata']
            status = item['status']
            phase = status.get('phase', 'Unknown')
            if meta.get('deletionTimestamp'):
                phase = 'Terminating'
            cs = status.get('containerStatuses', [])
            ready = cs[0].get('ready', False) if cs else False
            restarts = cs[0].get('restartCount', 0) if cs else 0
            pods.append({
                'name': meta['name'],
                'phase': phase,
                'ready': ready,
                'restarts': restarts,
                'created': meta.get('creationTimestamp', ''),
            })
        pods.sort(key=lambda p: p['created'])
        return pods

    def get_deployment():
        data = k8s_get(f'/apis/apps/v1/namespaces/{namespace}/deployments/db-worker')
        s = data.get('status', {})
        return {
            'desired': data.get('spec', {}).get('replicas', 0),
            'ready': s.get('readyReplicas', 0),
            'available': s.get('availableReplicas', 0),
        }

    def scale_deployment(replicas):
        k8s_request('PATCH',
            f'/apis/apps/v1/namespaces/{namespace}/deployments/db-worker',
            {'spec': {'replicas': replicas}}
        )

    def get_keda_status():
        data = k8s_get(f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/db-worker-scaler')
        annotations = data.get('metadata', {}).get('annotations', {})
        paused = annotations.get('autoscaling.keda.sh/paused', 'false') == 'true'
        return {'paused': paused}

    def set_keda_paused(paused):
        if paused:
            annotations = {
                'autoscaling.keda.sh/paused': 'true',
                'autoscaling.keda.sh/paused-replicas': '1',
            }
        else:
            annotations = {
                'autoscaling.keda.sh/paused': 'false',
                'autoscaling.keda.sh/paused-replicas': None,
            }
        k8s_request('PATCH',
            f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/db-worker-scaler',
            {'metadata': {'annotations': annotations}}
        )
        if paused:
            scale_deployment(1)

    HTML = r'''<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KEDA Database Scaling Demo</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&family=Red+Hat+Mono:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080f; --surface: rgba(255,255,255,.04); --surface-2: rgba(255,255,255,.07);
      --border: rgba(255,255,255,.08); --border-hover: rgba(255,255,255,.15);
      --text: #eef0f6; --text-dim: rgba(255,255,255,.45);
      --accent: #818cf8; --accent-soft: rgba(129,140,248,.12);
      --green: #34d399; --green-soft: rgba(52,211,153,.12);
      --amber: #fbbf24; --amber-soft: rgba(251,191,36,.12);
      --red: #fb7185; --red-soft: rgba(251,113,133,.12);
      --cyan: #22d3ee; --cyan-soft: rgba(34,211,238,.12);
      --radius: 16px; --radius-sm: 10px;
    }
    body {
      font-family: 'Red Hat Display', -apple-system, system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(129,140,248,.08), transparent),
