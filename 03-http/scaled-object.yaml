apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: http-app-scaler
  namespace: keda-demo
  annotations:
    autoscaling.keda.sh/paused: "true"
spec:
  scaleTargetRef:
    name: http-app
  pollingInterval: 10
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 20
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        query: sum(rate(http_requests_total{namespace="keda-demo",app="http-app"}[1m]))
        threshold: "5"
        authModes: "bearer"
      authenticationRef:
        name: prom-trigger-auth
