    .btn-surge {
      border: none; border-radius: var(--radius-sm); padding: 1.3rem 1.5rem;
      font-family: 'Red Hat Display', sans-serif; font-size: 1.05rem; font-weight: 900; cursor: pointer;
      background: linear-gradient(135deg, #fb7185, #ef4444, #dc2626);
      color: #fff; text-transform: uppercase; letter-spacing: .08em;
      transition: all .2s; position: relative; overflow: hidden;
    }
    .btn-surge::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,.1) 50%, transparent 70%);
      transform: translateX(-100%); transition: transform .6s;
    }
    .btn-surge:hover::before { transform: translateX(100%); }
    .btn-surge:hover { box-shadow: 0 8px 40px rgba(251,113,133,.3); transform: translateY(-2px); }
    .btn-surge:active { transform: scale(.97); }
    .btn-surge:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-surge:disabled::before { display: none; }
    .btn-surge.active {
      background: linear-gradient(135deg, #334155, #1e293b);
      box-shadow: 0 0 20px rgba(251,113,133,.15), inset 0 0 30px rgba(0,0,0,.3);
      animation: surge-pulse 1.5s ease infinite;
    }
    .btn-surge.active:hover { box-shadow: 0 0 25px rgba(251,113,133,.25); transform: none; }
    @keyframes surge-pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(251,113,133,.1); }
      50% { box-shadow: 0 0 30px rgba(251,113,133,.25); }
    }

    .live-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .live-stat {
      background: var(--surface); border-radius: var(--radius-sm); padding: .85rem;
      text-align: center; border: 1px solid var(--border); transition: all .4s ease;
    }
    .live-stat.rate-ok {
      border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.06);
      box-shadow: 0 0 20px rgba(52,211,153,.08);
    }
    .live-stat.rate-exceeded {
      border-color: rgba(251,113,133,.5); background: rgba(251,113,133,.1);
      box-shadow: 0 0 25px rgba(251,113,133,.15);
      animation: rate-pulse 1.5s ease infinite;
    }
    @keyframes rate-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(251,113,133,.1); }
      50% { box-shadow: 0 0 35px rgba(251,113,133,.25); }
    }
    .live-stat-value {
      font-family: 'Red Hat Mono', monospace; font-size: 1.5rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .live-stat-label { font-size: .55rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-top: .25rem; font-weight: 600; }
    .threshold-label { font-size: .6rem; color: var(--text-dim); margin-top: .3rem; font-weight: 500; }
    .threshold-label span { font-family: 'Red Hat Mono', monospace; font-weight: 700; }

    .error-bar-wrap { margin-top: .75rem; grid-column: 1 / -1; }
    .error-bar-label { font-size: .65rem; color: var(--text-dim); margin-bottom: .35rem; display: flex; justify-content: space-between; font-weight: 500; }
    .error-bar-bg { background: var(--surface-2); border-radius: 6px; height: 8px; overflow: hidden; }
    .error-bar-fill { height: 100%; border-radius: 6px; transition: width .4s cubic-bezier(.4,0,.2,1), background .3s; }
    .error-bar-fill.low { background: linear-gradient(90deg, var(--green), #6ee7b7); }
    .error-bar-fill.med { background: linear-gradient(90deg, var(--amber), #fcd34d); }
    .error-bar-fill.high { background: linear-gradient(90deg, var(--red), #fda4af); }

    .chart-wrap { margin-top: 1rem; grid-column: 1 / -1; }
    .chart-wrap canvas { width: 100% !important; height: 140px !important; }

    .timeline-box {
      max-height: 140px; overflow-y: auto;
      font-family: 'Red Hat Mono', monospace; font-size: .68rem;
      line-height: 1.7; padding: .7rem; background: var(--surface-2); border-radius: var(--radius-sm);
    }
    .ev { display: flex; gap: .5rem; }
    .ev .t { color: var(--text-dim); opacity: .4; white-space: nowrap; }
    .ev.added .m { color: var(--green); }
    .ev.removed .m { color: var(--red); }
    .ev.info .m { color: var(--cyan); }
    .ev.warn .m { color: var(--amber); }

    .fade-enter-active { transition: all .3s ease; }
    .fade-enter-from { opacity: 0; transform: translateY(4px); }

    @media (max-width: 900px) {
      .app { padding: 1.25rem; max-width: 100%; }
      .main-layout { grid-template-columns: 1fr; }
      .pods-sidebar { position: static; max-height: none; }
      .pods-grid { flex-direction: row; flex-wrap: wrap; }
      .pods-grid .pod-card { flex: 1 1 200px; }
      .stat-cards { grid-template-columns: repeat(2, 1fr); }
      .live-stats { grid-template-columns: repeat(3, 1fr); }
    }
    </style>
    </head>
    <body>
    <div id="app">
      <div class="app">
        <header>
          <img src="/logo.png" alt="Red Hat">
          <h1><em>KEDA</em> Autoscaling Demo</h1>
          <p>See how KEDA rescues an overloaded service using real-time Prometheus metrics</p>
        </header>

        <div class="main-layout">
          <div class="main-content">
              <div class="stat-cards">
                <div class="glass">
                  <div class="card-label">Replicas</div>
                  <div class="card-value v-accent">{{ deployment.ready }}</div>
                  <div class="card-sub">desired: {{ deployment.desired }}</div>
                  <div class="card-label" style="margin-top:1rem">ScaledObject</div>
                  <div :class="['so-status', scaledObjectExists ? 'active' : 'missing']">
                    <span class="so-dot"></span>
                    {{ scaledObjectExists ? 'Created' : 'Not Found' }}
                  </div>
                </div>
                <div class="glass ticker-card">
                  <div class="card-label">Total Requests</div>
                  <div class="ticker">
                    <div v-for="(d, i) in tickerDigits" :key="d.key"
                         class="ticker-slot digit">
                      <transition name="roll" mode="out-in">
                        <span :key="d.ch" class="ticker-ch">{{ d.ch }}</span>
                      </transition>
                    </div>
                  </div>
                  <div class="card-sub">uptime: {{ uptimeStr }}</div>
                </div>
                <div class="glass gauge-wrap">
                  <div class="card-label">Success Rate</div>
                  <div class="gauge" :style="{background: gaugeGradient}">
                    <div class="gauge-inner">
                      <div class="gauge-pct" :class="successRate >= 90 ? 'v-green' : successRate >= 50 ? 'v-amber' : 'v-red'">{{ successRate }}%</div>
                      <div class="gauge-pct-label">healthy</div>
                    </div>
                  </div>
                  <div class="gauge-legend">
                    <span><span class="gauge-legend-dot" style="background:var(--green)"></span>202</span>
                    <span><span class="gauge-legend-dot" style="background:var(--red)"></span>503</span>
                  </div>
                </div>
                <div class="glass keda-panel">
                  <div class="card-label">KEDA</div>
                  <div :class="['keda-badge', scaledObjectExists ? 'on' : 'off']">
                    <span class="keda-dot"></span>
                    {{ scaledObjectExists ? 'Active' : 'Disabled' }}
                  </div>
                  <div :class="['toggle-wrap', scaledObjectExists ? 'on' : 'off']" @click="toggleKeda" style="margin-top:.5rem">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                    <span class="toggle-label">{{ scaledObjectExists ? 'On' : 'Off' }}</span>
                  </div>
                </div>
              </div>

            <div class="glass surge-bar">
              <div class="surge-bar-left">
                <div class="surge-bar-label">Load Generator</div>
                <div class="surge-bar-row">
                  <span class="surge-bar-off">Off</span>
                  <input type="range" min="0" max="50" step="1"
                         :value="surgeThreads"
                         @input="setSurgeThreads($event.target.value)"
                         class="surge-slider"
                         :style="{'--pct': (surgeThreads / 50 * 100) + '%'}">
                  <span class="surge-bar-max">Max</span>
                </div>
                <div class="surge-bar-value" :class="surgeThreads > 0 ? 'v-red' : 'v-dim'">{{ surgeThreads }} threads</div>
              </div>
              <div :class="['surge-rate', rateStatus]">
                <div :class="['surge-rate-value', rateExceeded ? 'v-red' : 'v-green']">{{ live.rate }}</div>
                <div class="surge-rate-label">req/s</div>
                <div class="surge-rate-threshold">threshold: {{ THRESHOLD }}</div>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">
                Load Test
                <button class="btn-flat" @click="resetStats">Reset Stats</button>
              </div>
              <div>
                  <div class="live-stats">
                    <div class="live-stat">
                      <div class="live-stat-value v-green">{{ stats.success.toLocaleString() }}</div>
                      <div class="live-stat-label">OK (200)</div>
                    </div>
                    <div class="live-stat">
                      <div class="live-stat-value v-red">{{ stats.rejected.toLocaleString() }}</div>
                      <div class="live-stat-label">Rejected (503)</div>
                    </div>
                  </div>
                  <div class="error-bar-wrap">
                    <div class="error-bar-label">
                      <span>Error Rate</span>
                      <span>{{ errorPct }}%</span>
                    </div>
                    <div class="error-bar-bg">
                      <div :class="['error-bar-fill', errorLevel]"
                           :style="{width: errorPct + '%'}"></div>
                    </div>
                  </div>
                  <div class="chart-wrap">
                    <canvas ref="chartCanvas"></canvas>
                  </div>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">Timeline</div>
              <div class="timeline-box" ref="timeline">
                <div v-for="(ev, i) in events" :key="i" :class="['ev', ev.cls]">
                  <span class="t">{{ ev.time }}</span>
                  <span class="m">{{ ev.msg }}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="glass pods-sidebar">
            <div class="section-title">
              Pods <span class="badge">{{ pods.length }}</span>
            </div>
            <div class="pods-grid">
              <div v-for="p in pods" :key="p.name"
                   :class="['pod-card', 'pod-enter', {me: p.is_me}]">
                <div class="pod-header">
                  <span class="pod-name">
                    {{ p.name }}<span v-if="p.is_me" class="pod-me">YOU</span>
                  </span>
                  <span :class="['pod-phase', p.phase.toLowerCase().replace(/\s/g,'')]">
                    {{ p.phase }}
                  </span>
                </div>
                <div class="pod-info">
                  <span>
                    <span :class="['pod-dot-indicator', p.ready ? 'up' : 'down']"></span>
                    {{ p.ready ? 'Ready' : 'Not Ready' }}
                  </span>
                  <span>Age: {{ timeSince(p.created) }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick, watch } = Vue;

    createApp({
      setup() {
        const THRESHOLD = 5;
        const stats = reactive({ total: 0, success: 0, rejected: 0, uptime_seconds: 0 });
        const deployment = reactive({ ready: 1, desired: 1 });
        const pods = ref([]);
        const kedaPaused = ref(true);
        const scaledObjectExists = ref(false);
        const kedaToggling = ref(false);
        const surgeThreads = ref(0);
        const surgeSnap = reactive({ success: 0, rejected: 0, time: 0 });
        const live = reactive({ ok: 0, err: 0, rate: '0' });
        const events = reactive([]);
        const knownPods = new Set();
        const chartCanvas = ref(null);
        const timeline = ref(null);
        let chart = null;
        let intervals = [];

        const rateExceeded = computed(() => parseFloat(live.rate) > THRESHOLD);
        const rateStatus = computed(() => {
          const r = parseFloat(live.rate);
          if (r === 0) return '';
          return r > THRESHOLD ? 'rate-exceeded' : 'rate-ok';
        });

        const uptimeStr = computed(() => {
          const m = Math.floor(stats.uptime_seconds / 60);
          const s = Math.floor(stats.uptime_seconds % 60);
          return m + 'm ' + s + 's';
        });

        const errorPct = computed(() => {
          const t = live.ok + live.err;
          return t > 0 ? Math.round(live.err / t * 100) : 0;
        });

        const errorLevel = computed(() =>
          errorPct.value < 10 ? 'low' : errorPct.value < 40 ? 'med' : 'high'
        );

        let smoothSuccess = 100;
        const successRate = ref(100);

        const gaugeGradient = computed(() => {
          const s = successRate.value;
          const green = 'var(--green)';
          const red = 'var(--red)';
          const bg = 'rgba(255,255,255,.06)';
          const successDeg = Math.round(s * 3.6);
          return `conic-gradient(${green} 0deg, ${green} ${successDeg}deg, ${red} ${successDeg}deg, ${red} 360deg)`;
        });

        const tickerDigits = computed(() => {
          const s = String(stats.total);
          const padded = s.padStart(4, '0');
          return padded.split('').map((ch, i) => ({ ch, key: i }));
        });


        function timeSince(iso) {
          const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
          if (s < 60) return s + 's';
          if (s < 3600) return Math.floor(s / 60) + 'm';
          return Math.floor(s / 3600) + 'h';
        }

        function tlog(msg, cls) {
          events.push({ time: new Date().toLocaleTimeString(), msg, cls: cls || '' });
          if (events.length > 100) events.splice(0, events.length - 80);
          nextTick(() => { if (timeline.value) timeline.value.scrollTop = timeline.value.scrollHeight; });
        }

        let prevLive = null;
        let prevLiveTime = 0;
        let smoothRate = 0;
        async function fetchStats() {
          try {
            const d = await (await fetch('/stats')).json();
            Object.assign(stats, d);
            const now = Date.now();
            if (prevLive) {
              const dt = (now - prevLiveTime) / 1000 || 1;
              const dOk = Math.max(0, d.success - prevLive.success);
              const dErr = Math.max(0, d.rejected - prevLive.rejected);
              live.ok = dOk;
              live.err = dErr;
              const instantRate = (dOk + dErr) / dt;
              smoothRate = smoothRate === 0 ? instantRate : 0.2 * instantRate + 0.8 * smoothRate;
              live.rate = smoothRate.toFixed(1);
              const instantSuccess = (dOk + dErr) > 0 ? Math.round(dOk / (dOk + dErr) * 100) : smoothSuccess;
              smoothSuccess = 0.3 * instantSuccess + 0.7 * smoothSuccess;
              successRate.value = Math.round(smoothSuccess);
            }
            prevLive = { success: d.success, rejected: d.rejected };
            prevLiveTime = now;
          } catch(e) {}
        }

        async function fetchPods() {
          try {
            const d = await (await fetch('/pods')).json();
            deployment.ready = d.deployment.ready || 0;
            deployment.desired = d.deployment.desired;
            const current = new Set(d.pods.map(p => p.name));
            for (const name of knownPods) {
              if (!current.has(name)) {
                knownPods.delete(name);
                tlog('Pod removed: ' + name.split('-').pop(), 'removed');
              }
            }
            d.pods.forEach(p => {
              if (!knownPods.has(p.name)) {
                tlog('Pod added: ' + p.name.split('-').pop() + ' (' + p.phase + ')', 'added');
                knownPods.add(p.name);
              }
            });
            pods.value = d.pods;
          } catch(e) {}
        }

        async function fetchKeda() {
          try {
            const d = await (await fetch('/keda-status')).json();
            scaledObjectExists.value = d.exists;
            kedaPaused.value = d.paused;
          } catch(e) {}
        }

        async function toggleKeda() {
          const action = scaledObjectExists.value ? 'disable' : 'enable';
          scaledObjectExists.value = !scaledObjectExists.value;
          kedaPaused.value = action === 'disable';
          tlog(action === 'enable' ? 'ScaledObject CREATED — KEDA active' : 'ScaledObject DELETED — KEDA disabled', 'info');
          try {
            await fetch('/keda-toggle?action=' + action, {method: 'POST'});
          } catch(e) {
            scaledObjectExists.value = !scaledObjectExists.value;
            kedaPaused.value = !kedaPaused.value;
            tlog('Failed to toggle KEDA', 'warn');
          }
          fetchKeda();
        }

        async function resetStats() {
          await fetch('/reset-stats', {method: 'POST'});
          live.ok = 0; live.err = 0; live.rate = '0';
          tlog('Stats reset', 'info');
          fetchStats();
        }

        let surgePoll = null;
        let surgeDebounce = null;

        function setSurgeThreads(val) {
          const n = parseInt(val) || 0;
          surgeThreads.value = n;
          clearTimeout(surgeDebounce);
          surgeDebounce = setTimeout(() => {
            fetch('/surge-set?threads=' + n, {method: 'POST'});
            if (n > 0 && !surgePoll) {
              surgeSnap.time = Date.now();
              surgePoll = setInterval(fetchStats, 2000);
              tlog('Load set to ' + n + ' threads', 'warn');
            } else if (n === 0 && surgePoll) {
              clearInterval(surgePoll); surgePoll = null;
              tlog('Load stopped', 'info');
            } else if (n > 0) {
              tlog('Load adjusted to ' + n + ' threads', 'info');
            }
          }, 100);
        }

        function initChart() {
          if (!chartCanvas.value) return;
          const ctx = chartCanvas.value.getContext('2d');
          chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: [],
              datasets: [
                {
                  label: 'OK/s', data: [], borderColor: '#34d399',
                  backgroundColor: 'rgba(52,211,153,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2,
                },
                {
                  label: '503/s', data: [], borderColor: '#fb7185',
                  backgroundColor: 'rgba(251,113,133,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2,
                },
                {
                  label: 'Threshold', data: [], borderColor: 'rgba(251,191,36,.6)',
                  backgroundColor: 'transparent', fill: false,
                  borderDash: [6, 4], tension: 0, pointRadius: 0, borderWidth: 1.5,
                },
                {
                  label: 'Pods', data: [], borderColor: '#818cf8',
                  backgroundColor: 'rgba(129,140,248,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2, yAxisID: 'y1',
                },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              animation: { duration: 300 },
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: {
                  labels: { color: 'rgba(255,255,255,.45)', font: { family: 'Red Hat Display', size: 10 }, boxWidth: 12, padding: 12 },
                },
              },
              scales: {
                x: { display: false },
                y: {
                  position: 'left', beginAtZero: true,
                  grid: { color: 'rgba(255,255,255,.04)' },
                  ticks: { color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                  title: { display: true, text: 'req/s', color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                },
                y1: {
                  position: 'right', beginAtZero: true,
                  grid: { drawOnChartArea: false },
                  ticks: { color: 'rgba(129,140,248,.5)', font: { size: 10 }, stepSize: 1 },
                  title: { display: true, text: 'pods', color: 'rgba(129,140,248,.5)', font: { size: 10 } },
                },
              },
            },
          });
        }

        let prevStats = null;
        function updateChart() {
          if (!chart) return;
          const now = new Date().toLocaleTimeString();
          const okRate = prevStats ? Math.max(0, stats.success - prevStats.success) / 2 : 0;
          const errRate = prevStats ? Math.max(0, stats.rejected - prevStats.rejected) / 2 : 0;
          prevStats = { success: stats.success, rejected: stats.rejected };

          chart.data.labels.push(now);
          chart.data.datasets[0].data.push(okRate.toFixed(1));
          chart.data.datasets[1].data.push(errRate.toFixed(1));
          chart.data.datasets[2].data.push(THRESHOLD);
          chart.data.datasets[3].data.push(deployment.ready);

          const maxPts = 60;
          if (chart.data.labels.length > maxPts) {
            chart.data.labels.splice(0, chart.data.labels.length - maxPts);
            chart.data.datasets.forEach(ds => ds.data.splice(0, ds.data.length - maxPts));
          }
          chart.update('none');
        }

        onMounted(() => {
          fetchStats(); fetchPods(); fetchKeda();
          initChart();
          intervals.push(setInterval(() => { fetchStats().then(updateChart); }, 2000));
          intervals.push(setInterval(fetchPods, 2000));
          intervals.push(setInterval(fetchKeda, 3000));
        });

        onUnmounted(() => {
          intervals.forEach(clearInterval);
          if (surgePoll) clearInterval(surgePoll);
        });

        return {
          THRESHOLD, stats, deployment, pods, kedaPaused, scaledObjectExists, kedaToggling, surgeThreads,
          live, events, uptimeStr, errorPct, errorLevel,
          rateExceeded, rateStatus, successRate, gaugeGradient, tickerDigits,
          chartCanvas, timeline,
          timeSince, toggleKeda, resetStats, setSurgeThreads,
        };
      },
    }).mount('#app');
    </script>
    </body>
    </html>'''

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/healthz':
                self._ok(b'ok')
                return

            if self.path == '/metrics':
                with stats['lock']:
                    total = stats['total']
                    success = stats['success']
                    rejected = stats['rejected']
                body = (
                    '# HELP http_requests_total Total HTTP requests handled.\n'
                    '# TYPE http_requests_total counter\n'
                    f'http_requests_total{{app="http-app",status="200"}} {success}\n'
                    f'http_requests_total{{app="http-app",status="503"}} {rejected}\n'
                    '# HELP http_requests_in_flight Current concurrent requests.\n'
                    '# TYPE http_requests_in_flight gauge\n'
                    f'http_requests_in_flight{{app="http-app"}} {concurrent["count"]}\n'
                ).encode()
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain; version=0.0.4')
                self.end_headers()
                self.wfile.write(body)
                return

            if self.path == '/logo.png':
                try:
                    with open('/logo/rhlogo.png', 'rb') as f:
                        data = f.read()
                    self.send_response(200)
                    self.send_header('Content-Type', 'image/png')
                    self.send_header('Cache-Control', 'public, max-age=86400')
                    self.end_headers()
                    self.wfile.write(data)
                except FileNotFoundError:
                    self.send_response(404)
                    self.end_headers()
                return

            if self.path == '/stats':
                with stats['lock']:
                    data = {
                        'total': stats['total'],
                        'success': stats['success'],
                        'rejected': stats['rejected'],
                        'total_ms': round(stats['total_ms'], 1),
                        'uptime_seconds': round(time.time() - start_time, 1),
                    }
                self._json(data)
                return

            if self.path == '/pods':
                try:
                    self._json({'pods': get_pods(), 'deployment': get_deployment()})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/keda-status':
                try:
                    self._json(get_keda_status())
                except Exception as e:
                    self._json({'paused': True, 'error': str(e)})
                return

            if self.path.startswith('/burn'):
                reject = False
                with concurrent['lock']:
                    c = concurrent['count']
                    if c >= MAX_CONCURRENT:
                        reject = True
                    elif c > SOFT_LIMIT:
                        prob = min(MAX_REJECT_PROB, (c - SOFT_LIMIT) * 0.03)
                        reject = random.random() < prob
                    if not reject:
                        concurrent['count'] += 1

                if reject:
                    with stats['lock']:
                        stats['total'] += 1
                        stats['rejected'] += 1
                    self.send_response(503)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': 'overloaded',
                        'pod': hostname,
                        'concurrent': c,
                    }).encode())
                    return

                try:
                    intensity = 'medium'
                    if '?' in self.path:
                        params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                        intensity = params.get('intensity', 'medium')

                    duration = {'light': 0.2, 'medium': 0.5, 'heavy': 1.0}.get(intensity, 0.5)
                    t0 = time.time()
                    time.sleep(duration)
                    elapsed_ms = (time.time() - t0) * 1000

                    with stats['lock']:
                        stats['total'] += 1
                        stats['success'] += 1
                        stats['total_ms'] += elapsed_ms

                    self._json({'pod': hostname, 'compute_ms': round(elapsed_ms, 1)})
                finally:
                    with concurrent['lock']:
                        concurrent['count'] -= 1
                return

            self.send_response(200)
            self.send_header('Content-Type', 'text/html')
            self.end_headers()
            self.wfile.write(HTML.encode())

        def do_POST(self):
            if self.path == '/reset-stats':
                with stats['lock']:
                    stats['total'] = 0
                    stats['success'] = 0
                    stats['rejected'] = 0
                    stats['total_ms'] = 0
                self._json({'ok': True})
                return

            if self.path.startswith('/surge-set'):
                threads = 0
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    threads = int(params.get('threads', '0'))
                set_surge_threads(threads)
                self._json({'ok': True, 'threads': surge_state['target']})
                return

            if self.path.startswith('/keda-toggle'):
                action = 'enable'
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    action = params.get('action', 'enable')
                try:
                    if action == 'enable':
                        create_scaled_object()
                    else:
                        delete_scaled_object()
                        k8s_request('PATCH',
                            f'/apis/apps/v1/namespaces/{namespace}/deployments/http-app',
                            {'spec': {'replicas': 1}})
                    self._json({'ok': True, 'action': action})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

        def _ok(self, body):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)

        def _json(self, data, code=200):
            self.send_response(code)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode())

        def log_message(self, format, *args):
            pass

    server = ThreadedHTTPServer(('', 8080), Handler)
    print(f"HTTP server on :8080 (pod: {hostname}, max_concurrent: {MAX_CONCURRENT})")
    server.serve_forever()
