apiVersion: v1
kind: ConfigMap
metadata:
  name: http-app-code
  namespace: keda-demo
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from socketserver import ThreadingMixIn
    import json, math, os, random, ssl, threading, time, urllib.request, urllib.error

    class ThreadedHTTPServer(ThreadingMixIn, HTTPServer):
        daemon_threads = True

    hostname = os.environ.get('HOSTNAME', 'unknown')
    namespace = 'keda-demo'
    start_time = time.time()

    MAX_CONCURRENT = 50
    SOFT_LIMIT = 5
    MAX_REJECT_PROB = 0.15
    concurrent = {'count': 0, 'lock': threading.Lock()}
    stats = {
        'total': 0, 'success': 0, 'rejected': 0,
        'total_ms': 0, 'lock': threading.Lock(),
    }
    surge_state = {'target': 0, 'running': 0, 'lock': threading.Lock()}

    SVC_URL = 'http://http-app.keda-demo.svc.cluster.local:8080/burn'
    MAX_SURGE_THREADS = 50

    def surge_worker():
        with surge_state['lock']:
            surge_state['running'] += 1
        try:
            while True:
                with surge_state['lock']:
                    if surge_state['running'] > surge_state['target']:
                        surge_state['running'] -= 1
                        return
                try:
                    req = urllib.request.Request(SVC_URL)
                    with urllib.request.urlopen(req, timeout=10) as resp:
                        pass
                    with stats['lock']:
                        stats['total'] += 1
                        stats['success'] += 1
                except urllib.error.HTTPError as e:
                    with stats['lock']:
                        stats['total'] += 1
                        if e.code == 503:
                            stats['rejected'] += 1
                except Exception:
                    time.sleep(0.1)
                time.sleep(1)
        except Exception:
            with surge_state['lock']:
                surge_state['running'] -= 1

    def set_surge_threads(n):
        n = max(0, min(n, MAX_SURGE_THREADS))
        with surge_state['lock']:
            surge_state['target'] = n
            needed = n - surge_state['running']
        for _ in range(max(0, needed)):
            threading.Thread(target=surge_worker, daemon=True).start()

    K8S_HOST = 'https://kubernetes.default.svc'
    TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    CA_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'

    def k8s_request(method, path, body=None):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        data = json.dumps(body).encode() if body else None
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            data=data,
            headers={
                'Authorization': f'Bearer {token}',
                'Content-Type': 'application/merge-patch+json',
            },
            method=method,
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def k8s_get(path):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            headers={'Authorization': f'Bearer {token}'},
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def get_pods():
        data = k8s_get(f'/api/v1/namespaces/{namespace}/pods?labelSelector=app%3Dhttp-app')
        pods = []
        for item in data.get('items', []):
            meta = item['metadata']
            status = item['status']
            phase = status.get('phase', 'Unknown')
            if meta.get('deletionTimestamp'):
                phase = 'Terminating'
            cs = status.get('containerStatuses', [])
            ready = cs[0].get('ready', False) if cs else False
            restarts = cs[0].get('restartCount', 0) if cs else 0
            pods.append({
                'name': meta['name'],
                'phase': phase,
                'ready': ready,
                'restarts': restarts,
                'created': meta.get('creationTimestamp', ''),
                'is_me': meta['name'] == hostname,
            })
        pods.sort(key=lambda p: p['created'])
        return pods

    def get_deployment():
        data = k8s_get(f'/apis/apps/v1/namespaces/{namespace}/deployments/http-app')
        s = data.get('status', {})
        return {
            'desired': data.get('spec', {}).get('replicas', 0),
            'ready': s.get('readyReplicas', 0),
            'available': s.get('availableReplicas', 0),
        }

    def get_keda_status():
        try:
            data = k8s_get(f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/http-app-scaler')
            annotations = data.get('metadata', {}).get('annotations', {})
            paused = annotations.get('autoscaling.keda.sh/paused', 'false') == 'true'
            return {'exists': True, 'paused': paused}
        except Exception:
            return {'exists': False, 'paused': True}

    def k8s_delete(path):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            headers={'Authorization': f'Bearer {token}'},
            method='DELETE',
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def k8s_create(path, body):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        data = json.dumps(body).encode()
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            data=data,
            headers={
                'Authorization': f'Bearer {token}',
                'Content-Type': 'application/json',
            },
            method='POST',
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    SCALED_OBJECT_SPEC = {
        'apiVersion': 'keda.sh/v1alpha1',
        'kind': 'ScaledObject',
        'metadata': {'name': 'http-app-scaler', 'namespace': namespace},
        'spec': {
            'scaleTargetRef': {'name': 'http-app'},
            'pollingInterval': 10,
            'cooldownPeriod': 180,
            'minReplicaCount': 1,
            'maxReplicaCount': 20,
            'advanced': {
                'horizontalPodAutoscalerConfig': {
                    'behavior': {
                        'scaleDown': {
                            'stabilizationWindowSeconds': 120,
                            'policies': [{'type': 'Pods', 'value': 1, 'periodSeconds': 30}],
                        },
                        'scaleUp': {
                            'stabilizationWindowSeconds': 0,
                            'policies': [{'type': 'Pods', 'value': 4, 'periodSeconds': 15}],
                        },
                    },
                },
            },
            'triggers': [{
                'type': 'prometheus',
                'metadata': {
                    'serverAddress': 'https://thanos-querier.openshift-monitoring.svc.cluster.local:9091',
                    'query': 'sum(rate(http_requests_total{namespace="keda-demo",app="http-app"}[1m]))',
                    'threshold': '5',
                    'authModes': 'bearer',
                },
                'authenticationRef': {'name': 'prom-trigger-auth'},
            }],
        },
    }

    def create_scaled_object():
        k8s_create(f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects', SCALED_OBJECT_SPEC)

    def delete_scaled_object():
        k8s_delete(f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/http-app-scaler')

