apiVersion: batch/v1
kind: Job
metadata:
  name: http-load-generator
  namespace: keda-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "Starting HTTP load against http-app:8080..."
              for i in $(seq 1 2000); do
                curl -s -o /dev/null http://http-app.keda-demo.svc:8080/ &
                if [ $((i % 50)) -eq 0 ]; then
                  echo "Sent $i requests..."
                  wait
                fi
              done
              wait
              echo "Load test complete."
