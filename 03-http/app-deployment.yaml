apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-app
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-app
  template:
    metadata:
      labels:
        app: http-app
    spec:
      serviceAccountName: http-app-sa
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: logo
              mountPath: /logo
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app-code
          configMap:
            name: http-app-code
        - name: logo
          configMap:
            name: http-app-logo
