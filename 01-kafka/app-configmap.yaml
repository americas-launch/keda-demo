    .ev.info .m { color: var(--cyan); }
    .ev.warn .m { color: var(--amber); }

    .pods-list { display: flex; flex-direction: column; gap: .5rem; }
    .pod-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: .85rem;
      transition: all .3s cubic-bezier(.4,0,.2,1);
    }
    .pod-enter { animation: pod-in .4s cubic-bezier(.4,0,.2,1); }
    @keyframes pod-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
    .pod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem; }
    .pod-name {
      font-family: 'Red Hat Mono', monospace; font-size: .65rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px;
    }
    .pod-phase {
      font-size: .55rem; text-transform: uppercase; letter-spacing: .06em;
      padding: .15rem .45rem; border-radius: 4px; font-weight: 700;
    }
    .pod-phase.running { background: var(--green-soft); color: var(--green); }
    .pod-phase.pending { background: var(--amber-soft); color: var(--amber); }
    .pod-phase.containercreating { background: var(--cyan-soft); color: var(--cyan); }
    .pod-phase.terminating { background: var(--red-soft); color: var(--red); }
    .pod-info { font-size: .65rem; color: var(--text-dim); display: flex; gap: .75rem; align-items: center; }
    .pod-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: .2rem; }
    .pod-dot.up { background: var(--green); box-shadow: 0 0 4px var(--green); }
    .pod-dot.down { background: var(--amber); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .pods-empty {
      font-size: .72rem; color: var(--text-dim); text-align: center;
      padding: 1.25rem .5rem; line-height: 1.7;
    }
    .pods-empty-icon { font-size: 1.5rem; margin-bottom: .3rem; opacity: .3; }

    .fade-enter-active { transition: all .3s ease; }
    .fade-enter-from { opacity: 0; transform: translateY(4px); }

    @media (max-width: 900px) {
      .app { padding: 1.25rem; max-width: 100%; }
      .main-layout { grid-template-columns: 1fr; }
      .pods-sidebar { position: static; max-height: none; }
      .grid-top { grid-template-columns: 1fr; }
      .live-stats { grid-template-columns: repeat(3, 1fr); }
      .partitions-grid { grid-template-columns: repeat(3, 1fr); }
    }
    </style>
    </head>
    <body>
    <div id="app">
      <div class="app">
        <header>
          <img src="/logo.png" alt="Red Hat">
          <h1><em>KEDA</em> Kafka Scaling Demo</h1>
          <p>Consumers auto-scale from zero based on Kafka consumer group lag</p>
        </header>

        <div class="main-layout">
          <div class="main-content">
            <div class="grid-top">
              <div class="stat-cards">
                <div class="glass">
                  <div class="card-label">Consumers</div>
                  <div class="card-value v-accent">{{ deployment.ready }}</div>
                  <div class="card-sub">desired: {{ deployment.desired }}</div>
                </div>
                <div class="glass ticker-card">
                  <div class="card-label">Messages Produced</div>
                  <div class="ticker">
                    <div v-for="(d, i) in tickerDigits" :key="d.key"
                         class="ticker-slot digit">
                      <transition name="roll" mode="out-in">
                        <span :key="d.ch" class="ticker-ch">{{ d.ch }}</span>
                      </transition>
                    </div>
                  </div>
                  <div class="card-sub">uptime: {{ uptimeStr }}</div>
                </div>
                <div class="glass gauge-wrap">
                  <div class="card-label">Consumer Progress</div>
                  <div class="gauge" :style="{background: gaugeGradient}">
                    <div class="gauge-inner">
                      <div class="gauge-pct" :class="progressColor">{{ progressPct }}%</div>
                      <div class="gauge-pct-label">consumed</div>
                    </div>
                  </div>
                  <div class="gauge-legend">
                    <span><span class="gauge-legend-dot" style="background:var(--green)"></span>Consumed</span>
                    <span><span class="gauge-legend-dot" style="background:var(--amber)"></span>Lag</span>
                  </div>
                </div>
              </div>

              <div class="glass keda-panel">
                <div class="keda-label">KEDA Autoscaler</div>
                <div class="keda-badge on">
                  <span class="keda-dot"></span>
                  Active
                </div>
                <div class="keda-desc">
                  Monitoring: <code>kafka lag &gt; {{ LAG_THRESHOLD }}</code><br>
                  Consumers scale when consumer group lag exceeds threshold.
                </div>
                <div class="produce-controls">
                  <div class="control-group-label">Produce Messages</div>
                  <div class="produce-buttons">
                    <button class="btn-produce" @click="produceMessages(25)" :disabled="false">+25</button>
                    <button class="btn-produce" @click="produceMessages(50)" :disabled="false">+50</button>
                    <button class="btn-produce" @click="produceMessages(100)" :disabled="false">+100</button>
                    <button class="btn-produce" @click="produceMessages(500)" :disabled="false">+500</button>
                    <button class="btn-produce" @click="produceMessages(1000)" :disabled="false">+1000</button>
                  </div>
                  <button class="btn-clear" @click="clearStats">Clear Stats</button>
                </div>
              </div>
            </div>

            <div class="timer-section">
              <div class="glass timer-card">
                <div class="card-label">Time to Completion</div>
                <div :class="['timer-value', timerAnimClass, timerColor]">
                  {{ timerDisplay }}
                </div>
                <div class="timer-sub">{{ timerStatusText }}</div>
              </div>
              <div class="glass">
                <div class="run-history-title">Run History</div>
                <div class="run-history" v-if="runHistory.length > 0">
                  <div v-for="(run, i) in runHistory" :key="i" class="run-row">
                    <span class="run-num">#{{ runHistory.length - i }}</span>
                    <span class="run-time" :class="i === 0 ? 'v-accent' : ''">{{ run.elapsed }}s</span>
                    <span class="run-msgs">{{ run.messages }} msgs / {{ run.consumers || '?' }} pods</span>
                  </div>
                </div>
                <div v-else class="run-empty">No completed runs yet</div>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">Consumer Lag</div>
              <div class="live-stats">
                <div :class="['live-stat', {'lag-alert': lagData.total_lag > 0 && deployment.ready === 0}]">
                  <div class="live-stat-value v-amber">{{ lagData.total_lag }}</div>
                  <div class="live-stat-label">Total Lag</div>
                  <div class="threshold-label">threshold: <span>{{ LAG_THRESHOLD }}</span></div>
                </div>
                <div class="live-stat">
                  <div class="live-stat-value v-cyan">{{ lagData.total_messages }}</div>
                  <div class="live-stat-label">Total Messages</div>
                </div>
                <div class="live-stat">
                  <div class="live-stat-value v-green">{{ consumed }}</div>
                  <div class="live-stat-label">Consumed</div>
                </div>
              </div>
              <div class="partitions-grid">
                <div v-for="p in lagData.partitions" :key="p.partition"
                     :class="['partition-card', {'has-lag': p.lag > 0}]">
                  <div class="partition-id">P{{ p.partition }}</div>
                  <div class="partition-lag" :class="p.lag > 0 ? 'v-amber' : 'v-green'">{{ p.lag }}</div>
                  <div class="partition-offsets">{{ p.committed_offset }} / {{ p.end_offset }}</div>
                </div>
              </div>
              <div class="lag-bar-wrap">
                <div class="lag-bar-label">
                  <span>Lag Pressure</span>
                  <span>{{ lagData.total_lag }} messages behind</span>
                </div>
                <div class="lag-bar-bg">
                  <div :class="['lag-bar-fill', lagLevel]"
                       :style="{width: lagBarPct + '%'}"></div>
                </div>
              </div>
              <div class="chart-wrap">
                <canvas ref="chartCanvas"></canvas>
              </div>
            </div>

            <div class="glass section">
              <div class="section-title">Timeline</div>
              <div class="timeline-box" ref="timeline">
                <div v-for="(ev, i) in events" :key="i" :class="['ev', ev.cls]">
                  <span class="t">{{ ev.time }}</span>
                  <span class="m">{{ ev.msg }}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="glass pods-sidebar">
            <div class="section-title">
              Consumers <span class="badge">{{ pods.length }}</span>
            </div>
            <div class="pods-list">
              <div v-for="p in pods" :key="p.name" class="pod-card pod-enter">
                <div class="pod-header">
                  <span class="pod-name">{{ p.name }}</span>
                  <span :class="['pod-phase', p.phase.toLowerCase().replace(/\s/g,'')]">
                    {{ p.phase }}
                  </span>
                </div>
                <div class="pod-info">
                  <span>
                    <span :class="['pod-dot', p.ready ? 'up' : 'down']"></span>
                    {{ p.ready ? 'Ready' : 'Not Ready' }}
                  </span>
                  <span>Age: {{ timeSince(p.created) }}</span>
                </div>
              </div>
              <div v-if="pods.length === 0" class="pods-empty">
                <div class="pods-empty-icon">0</div>
                No consumers running.<br>
                KEDA will scale from zero<br>when lag appears.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;

    createApp({
      setup() {
        const LAG_THRESHOLD = 50;
        const lagData = reactive({ partitions: [], total_lag: 0, total_messages: 0 });
        const deployment = reactive({ ready: 0, desired: 0 });
        const pods = ref([]);
        const kedaPaused = ref(true);
        const producing = ref(false);
        const totalProduced = ref(0);
        const events = reactive([]);
        const knownPods = new Set();
        const chartCanvas = ref(null);
        const timeline = ref(null);
        let chart = null;
        let intervals = [];
        let uptimeSeconds = ref(0);
        const timerElapsed = ref(0);
        const timerState = ref('idle');
        const timerMessages = ref(0);
        const timerConsumers = ref(0);
        const runHistory = ref([]);

        const timerDisplay = computed(() => {
          if (timerState.value === 'idle') return '--.-s';
          if (timerState.value === 'waiting') return '--.-s';
          return timerElapsed.value.toFixed(1) + 's';
        });

        const timerStatusText = computed(() => {
          if (timerState.value === 'idle') return 'Produce messages to start';
          if (timerState.value === 'waiting') return 'Waiting for consumers to scale up...';
          if (timerState.value === 'processing') return timerMessages.value + ' messages — ' + timerConsumers.value + ' consumer(s)';
          if (timerState.value === 'done') return timerMessages.value + ' messages — ' + msgPerSec.value + ' msg/s (peak: ' + timerConsumers.value + ' consumers)';
          return '';
        });

        const timerColor = computed(() => {
          if (timerState.value === 'processing') return 'v-amber';
          if (timerState.value === 'done') return 'v-green';
          if (timerState.value === 'waiting') return 'v-cyan';
          return 'v-accent';
        });

        const timerAnimClass = computed(() => {
          if (timerState.value === 'processing') return 'running';
          if (timerState.value === 'waiting') return 'running';
          return '';
        });

        const msgPerSec = computed(() => {
          if (timerElapsed.value === 0) return '0';
          return (timerMessages.value / timerElapsed.value).toFixed(1);
        });

        const uptimeStr = computed(() => {
          const m = Math.floor(uptimeSeconds.value / 60);
          const s = Math.floor(uptimeSeconds.value % 60);
          return m + 'm ' + s + 's';
        });

        const consumed = computed(() => {
          return Math.max(0, lagData.total_messages - lagData.total_lag);
        });

        const progressPct = computed(() => {
          if (lagData.total_messages === 0) return 100;
          return Math.round(consumed.value / lagData.total_messages * 100);
        });

        const progressColor = computed(() => {
          const p = progressPct.value;
          if (p >= 90) return 'v-green';
          if (p >= 40) return 'v-amber';
          return 'v-red';
        });

        const gaugeGradient = computed(() => {
          const pct = progressPct.value;
          const deg = Math.round(pct * 3.6);
          return 'conic-gradient(var(--green) 0deg, var(--green) ' + deg + 'deg, var(--amber) ' + deg + 'deg, var(--amber) 360deg)';
        });

        const lagBarPct = computed(() => {
          if (lagData.total_lag === 0) return 0;
          const max = Math.max(lagData.total_messages, 100);
          return Math.min(100, Math.round(lagData.total_lag / max * 100));
        });

        const lagLevel = computed(() => {
          const lag = lagData.total_lag;
          if (lag <= LAG_THRESHOLD) return 'low';
          if (lag <= LAG_THRESHOLD * 5) return 'med';
          return 'high';
        });

        const tickerDigits = computed(() => {
          const s = String(totalProduced.value);
          const padded = s.padStart(4, '0');
          return padded.split('').map((ch, i) => ({ ch, key: i }));
        });

        function timeSince(iso) {
          const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
          if (s < 60) return s + 's';
          if (s < 3600) return Math.floor(s / 60) + 'm';
          return Math.floor(s / 3600) + 'h';
        }

        function tlog(msg, cls) {
          events.push({ time: new Date().toLocaleTimeString(), msg, cls: cls || '' });
          if (events.length > 100) events.splice(0, events.length - 80);
          nextTick(() => { if (timeline.value) timeline.value.scrollTop = timeline.value.scrollHeight; });
        }

        async function fetchLag() {
          try {
            const d = await (await fetch('/lag')).json();
            lagData.partitions = d.partitions || [];
            lagData.total_lag = d.total_lag || 0;
            lagData.total_messages = d.total_messages || 0;
            totalProduced.value = d.total_produced || 0;
            uptimeSeconds.value = d.uptime_seconds || 0;
            const prevState = timerState.value;
            timerElapsed.value = d.timer_elapsed || 0;
            timerState.value = d.timer_state || 'idle';
            timerMessages.value = d.timer_messages || 0;
            timerConsumers.value = d.timer_consumers || 0;
            if (d.timer_history) runHistory.value = [...d.timer_history].reverse();
            if (prevState === 'processing' && timerState.value === 'done') {
              tlog('Completed in ' + timerElapsed.value + 's (' + msgPerSec.value + ' msg/s, peak ' + timerConsumers.value + ' consumers)', 'added');
            }
            if (prevState !== 'waiting' && timerState.value === 'waiting') {
              tlog('Waiting for consumers to scale up...', 'warn');
            }
            if (prevState === 'waiting' && timerState.value === 'processing') {
              tlog('Consumers started — processing timer started', 'info');
            }
          } catch(e) {}
        }

        async function fetchPods() {
          try {
            const d = await (await fetch('/pods')).json();
            deployment.ready = d.deployment.ready || 0;
            deployment.desired = d.deployment.desired;
            const current = new Set(d.pods.map(p => p.name));
            for (const name of knownPods) {
              if (!current.has(name)) {
                knownPods.delete(name);
                tlog('Consumer removed: ' + name.split('-').pop(), 'removed');
              }
            }
            d.pods.forEach(p => {
              if (!knownPods.has(p.name)) {
                tlog('Consumer added: ' + p.name.split('-').pop() + ' (' + p.phase + ')', 'added');
                knownPods.add(p.name);
              }
            });
            pods.value = d.pods;
          } catch(e) {}
        }

        async function fetchKeda() {
          try {
            const d = await (await fetch('/keda-status')).json();
            kedaPaused.value = d.paused;
          } catch(e) {}
        }

        async function toggleKeda() {
          const action = kedaPaused.value ? 'enable' : 'disable';
          kedaPaused.value = !kedaPaused.value;
          tlog(action === 'enable' ? 'KEDA autoscaler ENABLED' : 'KEDA autoscaler DISABLED', 'info');
          try {
            await fetch('/keda-toggle?action=' + action, {method: 'POST'});
          } catch(e) {
            kedaPaused.value = !kedaPaused.value;
            tlog('Failed to toggle KEDA', 'warn');
          }
          fetchKeda();
        }

        async function clearStats() {
          tlog('Clearing stats...', 'info');
          try {
            await fetch('/clear-stats', {method: 'POST'});
            totalProduced.value = 0;
            tlog('Stats cleared', 'removed');
            fetchLag();
          } catch(e) {
            tlog('Failed to clear stats', 'warn');
          }
        }

        async function produceMessages(count) {
          tlog('Producing ' + count + ' messages...', 'info');
          try {
            const r = await (await fetch('/produce?count=' + count, {method: 'POST'})).json();
            if (r.ok) {
              tlog(count + ' messages queued to Kafka', 'added');
            } else {
              tlog('Failed: ' + (r.error || 'unknown'), 'warn');
            }
          } catch(e) {
            tlog('Failed to produce messages', 'warn');
          }
          for (let i = 0; i < 5; i++) {
            setTimeout(() => { fetchLag().then(updateChart); }, (i + 1) * 500);
          }
        }

        function initChart() {
          if (!chartCanvas.value) return;
          const ctx = chartCanvas.value.getContext('2d');
          chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: [],
              datasets: [
                {
                  label: 'Consumer Lag', data: [], borderColor: '#fbbf24',
                  backgroundColor: 'rgba(251,191,36,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2,
                },
                {
                  label: 'Threshold', data: [], borderColor: 'rgba(251,191,36,.5)',
                  backgroundColor: 'transparent', fill: false,
                  borderDash: [6, 4], tension: 0, pointRadius: 0, borderWidth: 1.5,
                },
                {
                  label: 'Consumers', data: [], borderColor: '#818cf8',
                  backgroundColor: 'rgba(129,140,248,.08)', fill: true,
                  tension: .4, pointRadius: 0, borderWidth: 2, yAxisID: 'y1',
                },
              ],
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              animation: { duration: 300 },
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: {
                  labels: { color: 'rgba(255,255,255,.45)', font: { family: 'Red Hat Display', size: 10 }, boxWidth: 12, padding: 12 },
                },
              },
              scales: {
                x: { display: false },
                y: {
                  position: 'left', beginAtZero: true,
                  grid: { color: 'rgba(255,255,255,.04)' },
                  ticks: { color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                  title: { display: true, text: 'consumer lag', color: 'rgba(255,255,255,.3)', font: { size: 10 } },
                },
                y1: {
                  position: 'right', beginAtZero: true,
                  grid: { drawOnChartArea: false },
                  ticks: { color: 'rgba(129,140,248,.5)', font: { size: 10 }, stepSize: 1 },
                  title: { display: true, text: 'consumers', color: 'rgba(129,140,248,.5)', font: { size: 10 } },
                },
              },
            },
          });
        }

        function updateChart() {
          if (!chart) return;
          const now = new Date().toLocaleTimeString();
          chart.data.labels.push(now);
          chart.data.datasets[0].data.push(lagData.total_lag);
          chart.data.datasets[1].data.push(LAG_THRESHOLD);
          chart.data.datasets[2].data.push(deployment.ready);

          const maxPts = 60;
          if (chart.data.labels.length > maxPts) {
            chart.data.labels.splice(0, chart.data.labels.length - maxPts);
            chart.data.datasets.forEach(ds => ds.data.splice(0, ds.data.length - maxPts));
          }
          chart.update('none');
        }

        onMounted(() => {
          fetchLag(); fetchPods(); fetchKeda();
          initChart();
          intervals.push(setInterval(() => { fetchLag().then(updateChart); }, 2000));
          intervals.push(setInterval(fetchPods, 2000));
          intervals.push(setInterval(fetchKeda, 3000));
        });

        onUnmounted(() => intervals.forEach(clearInterval));

        return {
          LAG_THRESHOLD, lagData, deployment, pods, kedaPaused, producing,
          totalProduced, events, uptimeStr, consumed, progressPct,
          progressColor, gaugeGradient, lagBarPct, lagLevel,
          tickerDigits, chartCanvas, timeline,
          timerElapsed, timerState, timerMessages, timerConsumers, timerDisplay, timerStatusText, timerColor, timerAnimClass, msgPerSec, runHistory,
          timeSince, toggleKeda, produceMessages, clearStats,
        };
      },
    }).mount('#app');
    </script>
    </body>
    </html>'''

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/healthz':
                self._ok(b'ok')
                return

            if self.path == '/logo.png':
                try:
                    with open('/logo/rhlogo.png', 'rb') as f:
                        data = f.read()
                    self.send_response(200)
                    self.send_header('Content-Type', 'image/png')
                    self.send_header('Cache-Control', 'public, max-age=86400')
                    self.end_headers()
                    self.wfile.write(data)
                except FileNotFoundError:
                    self.send_response(404)
                    self.end_headers()
                return

            if self.path == '/lag':
                try:
                    lag = get_consumer_lag()
                    lag['uptime_seconds'] = round(time.time() - start_time, 1)
                    with produce_stats['lock']:
                        lag['total_produced'] = produce_stats['total_produced']
                    try:
                        dep = get_deployment()
                        ready_consumers = dep.get('ready', 0)
                    except Exception:
                        ready_consumers = 0
                    with run_timer['lock']:
                        now = time.time()
                        run_timer['peak_consumers'] = max(run_timer['peak_consumers'], ready_consumers)
                        if run_timer['produce_time'] and run_timer['run_end'] is None:
                            if run_timer['processing_start'] is None and ready_consumers > 0:
                                run_timer['processing_start'] = now
                                run_timer['run_messages'] = lag['total_lag']
                            if run_timer['processing_start'] and lag['total_lag'] == 0:
                                run_timer['run_end'] = now
                                elapsed = round(run_timer['run_end'] - run_timer['processing_start'], 1)
                                run_timer['history'].append({
                                    'elapsed': elapsed,
                                    'messages': run_timer['run_messages'],
                                    'consumers': run_timer['peak_consumers'],
                                })
                                if len(run_timer['history']) > 10:
                                    run_timer['history'] = run_timer['history'][-10:]
                        if run_timer['produce_time'] is None:
                            lag['timer_state'] = 'idle'
                            lag['timer_elapsed'] = 0
                        elif run_timer['run_end']:
                            lag['timer_state'] = 'done'
                            lag['timer_elapsed'] = round(run_timer['run_end'] - run_timer['processing_start'], 1)
                        elif run_timer['processing_start']:
                            lag['timer_state'] = 'processing'
                            lag['timer_elapsed'] = round(now - run_timer['processing_start'], 1)
                        else:
                            lag['timer_state'] = 'waiting'
                            lag['timer_elapsed'] = 0
                        lag['timer_messages'] = run_timer['run_messages']
                        lag['timer_consumers'] = run_timer['peak_consumers']
                        lag['timer_history'] = list(run_timer['history'])
                    self._json(lag)
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/pods':
                try:
                    self._json({'pods': get_pods(), 'deployment': get_deployment()})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

            if self.path == '/keda-status':
                try:
                    self._json(get_keda_status())
                except Exception as e:
                    self._json({'paused': True, 'error': str(e)})
                return

            self.send_response(200)
            self.send_header('Content-Type', 'text/html')
            self.end_headers()
            self.wfile.write(HTML.encode())

        def do_POST(self):
            if self.path == '/clear-stats':
                with produce_stats['lock']:
                    produce_stats['total_produced'] = 0
                with run_timer['lock']:
                    run_timer['produce_time'] = None
                    run_timer['processing_start'] = None
                    run_timer['run_end'] = None
                    run_timer['run_messages'] = 0
                    run_timer['initial_lag'] = 0
                    run_timer['peak_consumers'] = 0
                try:
                    consumer = KafkaConsumer(
                        bootstrap_servers=KAFKA_BOOTSTRAP,
                        group_id=KAFKA_GROUP,
                        enable_auto_commit=False,
                    )
                    partitions = consumer.partitions_for_topic(KAFKA_TOPIC)
                    if partitions:
                        tps = [TopicPartition(KAFKA_TOPIC, p) for p in partitions]
                        end_offsets = consumer.end_offsets(tps)
                        for tp, offset in end_offsets.items():
                            consumer.commit({tp: OffsetAndMetadata(offset, '')})
                    consumer.close()
                except Exception:
                    pass
                self._json({'ok': True})
                return

            if self.path.startswith('/produce'):
                count = 50
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    count = min(int(params.get('count', 50)), 500)
                try:
                    result = produce_messages(count)
                    self._json(result)
                except Exception as e:
                    self._json({'ok': False, 'error': str(e)}, 500)
                return

            if self.path.startswith('/keda-toggle'):
                action = 'enable'
                if '?' in self.path:
                    params = dict(p.split('=') for p in self.path.split('?')[1].split('&') if '=' in p)
                    action = params.get('action', 'enable')
                try:
                    set_keda_paused(action == 'disable')
                    self._json({'ok': True, 'action': action})
                except Exception as e:
                    self._json({'error': str(e)}, 500)
                return

        def _ok(self, body):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)

        def _json(self, data, code=200):
            self.send_response(code)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode())

        def log_message(self, format, *args):
            pass

    server = ThreadedHTTPServer(('', 8080), Handler)
    print(f"Kafka dashboard on :8080 (pod: {hostname})")
    server.serve_forever()
