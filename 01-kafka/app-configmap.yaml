  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from socketserver import ThreadingMixIn
    import json, os, ssl, threading, time, urllib.request

    class ThreadedHTTPServer(ThreadingMixIn, HTTPServer):
        daemon_threads = True

    hostname = os.environ.get('HOSTNAME', 'unknown')
    namespace = 'keda-demo'
    start_time = time.time()

    KAFKA_BOOTSTRAP = os.environ.get('KAFKA_BOOTSTRAP', 'lightwell-kafka-bootstrap.lightwell-infra.svc:9092')
    KAFKA_TOPIC = os.environ.get('KAFKA_TOPIC', 'keda-demo-orders')
    KAFKA_GROUP = os.environ.get('KAFKA_GROUP', 'keda-demo-consumer-group')

    produce_stats = {'total_produced': 0, 'lock': threading.Lock()}
    run_timer = {
        'lock': threading.Lock(),
        'produce_time': None,
        'processing_start': None,
        'run_end': None,
        'run_messages': 0,
        'initial_lag': 0,
        'peak_consumers': 0,
        'history': [],
    }

    from kafka import KafkaProducer, KafkaConsumer, TopicPartition, OffsetAndMetadata
    from kafka.admin import KafkaAdminClient

    def get_consumer_lag():
        try:
            consumer = KafkaConsumer(
                bootstrap_servers=KAFKA_BOOTSTRAP,
                group_id=KAFKA_GROUP,
                enable_auto_commit=False,
            )
            partitions = consumer.partitions_for_topic(KAFKA_TOPIC)
            if not partitions:
                consumer.close()
                return {'partitions': [], 'total_lag': 0, 'total_messages': 0}

            tps = [TopicPartition(KAFKA_TOPIC, p) for p in sorted(partitions)]
            end_offsets = consumer.end_offsets(tps)

            committed = {}
            for tp in tps:
                c = consumer.committed(tp)
                committed[tp] = c if c is not None else 0

            consumer.close()

            partition_data = []
            total_lag = 0
            total_messages = 0
            for tp in tps:
                end = end_offsets.get(tp, 0)
                cur = committed.get(tp, 0)
                lag = max(0, end - cur)
                partition_data.append({
                    'partition': tp.partition,
                    'end_offset': end,
                    'committed_offset': cur,
                    'lag': lag,
                })
                total_lag += lag
                total_messages += end

            return {
                'partitions': partition_data,
                'total_lag': total_lag,
                'total_messages': total_messages,
            }
        except Exception as e:
            return {'partitions': [], 'total_lag': 0, 'total_messages': 0, 'error': str(e)}

    produce_state = {'producing': False, 'sent': 0, 'target': 0, 'lock': threading.Lock()}

    def _produce_worker(count):
        try:
            producer = KafkaProducer(
                bootstrap_servers=KAFKA_BOOTSTRAP,
                value_serializer=lambda v: json.dumps(v).encode('utf-8'),
            )
            for i in range(count):
                order = {"order_id": i, "item": f"widget-{i}", "quantity": i % 10 + 1, "ts": time.time()}
                producer.send(KAFKA_TOPIC, value=order)
                if (i + 1) % 50 == 0:
                    producer.flush()
            producer.flush()
            producer.close()
        except Exception:
            pass
        finally:
            with produce_state['lock']:
                produce_state['producing'] = False

    def produce_messages(count):
        with produce_stats['lock']:
            produce_stats['total_produced'] += count
        with produce_state['lock']:
            produce_state['producing'] = True
            produce_state['sent'] = 0
            produce_state['target'] = count
        with run_timer['lock']:
            if run_timer['produce_time'] is None or run_timer['run_end'] is not None:
                run_timer['produce_time'] = time.time()
                run_timer['processing_start'] = None
                run_timer['run_end'] = None
                run_timer['run_messages'] = count
                run_timer['peak_consumers'] = 0
            else:
                run_timer['run_messages'] += count
        threading.Thread(target=_produce_worker, args=(count,), daemon=True).start()
        return {'ok': True, 'produced': count}

    K8S_HOST = 'https://kubernetes.default.svc'
    TOKEN_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    CA_PATH = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'

    def k8s_get(path):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            headers={'Authorization': f'Bearer {token}'},
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def k8s_request(method, path, body=None):
        with open(TOKEN_PATH) as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=CA_PATH)
        data = json.dumps(body).encode() if body else None
        req = urllib.request.Request(
            f'{K8S_HOST}{path}',
            data=data,
            headers={
                'Authorization': f'Bearer {token}',
                'Content-Type': 'application/merge-patch+json',
            },
            method=method,
        )
        with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
            return json.loads(resp.read())

    def get_pods():
        data = k8s_get(f'/api/v1/namespaces/{namespace}/pods?labelSelector=app%3Dkafka-consumer')
        pods = []
        for item in data.get('items', []):
            meta = item['metadata']
            status = item['status']
            phase = status.get('phase', 'Unknown')
            if meta.get('deletionTimestamp'):
                phase = 'Terminating'
            cs = status.get('containerStatuses', [])
            ready = cs[0].get('ready', False) if cs else False
            restarts = cs[0].get('restartCount', 0) if cs else 0
            pods.append({
                'name': meta['name'],
                'phase': phase,
                'ready': ready,
                'restarts': restarts,
                'created': meta.get('creationTimestamp', ''),
            })
        pods.sort(key=lambda p: p['created'])
        return pods

    def get_deployment():
        data = k8s_get(f'/apis/apps/v1/namespaces/{namespace}/deployments/kafka-consumer')
        s = data.get('status', {})
        return {
            'desired': data.get('spec', {}).get('replicas', 0),
            'ready': s.get('readyReplicas', 0),
            'available': s.get('availableReplicas', 0),
        }

    def get_keda_status():
        try:
            data = k8s_get(f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/kafka-consumer-scaler')
            annotations = data.get('metadata', {}).get('annotations', {})
            paused = annotations.get('autoscaling.keda.sh/paused', 'false') == 'true'
            return {'paused': paused}
        except Exception:
            return {'paused': True}

    def set_keda_paused(paused):
        val = 'true' if paused else 'false'
        k8s_request('PATCH',
            f'/apis/keda.sh/v1alpha1/namespaces/{namespace}/scaledobjects/kafka-consumer-scaler',
            {'metadata': {'annotations': {'autoscaling.keda.sh/paused': val}}}
        )

